version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polymarket-app
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    command: bash -lc "pip install --no-cache-dir -r requirements.txt && python backend/scheduler.py"
